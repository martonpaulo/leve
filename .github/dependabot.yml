# Fleet Dependabot configuration, from skill-deck's project-setup template
# (assets/dependabot.template.yml). Only GitHub Actions: Dependabot's Swift (6.3.1) cannot read
# `swift-tools-version:6.4`, so a `swift` entry would fail on every run; Sparkle, Leve's one
# package dependency, is updated by hand (AGENTS.md, divergence `dependabot`). The cooldown keeps a
# day-old release out of a pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:17"
      timezone: UTC
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:17"
      timezone: UTC
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 3
      semver-patch-days: 3
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      swift-dependencies:
        update-types: [minor, patch]
