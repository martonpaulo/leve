name: Deploy

on:
  # Deploy never revalidates the app: it waits for Validate to pass on main and publishes the exact
  # commit Validate checked, as WindowHop does (#28).
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deployment that has started always finishes; a newer run waits in the queue (GitHub keeps only
# the newest pending one). Cancelling mid-deploy records an `error` deployment that can stay the
# latest github-pages status. GitHub's own Pages template does the same.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Publishing is skipped when the published input (site/ plus this workflow) is identical to the
  # last *successful* Pages deployment. Comparing against that, not the previous push, means a site
  # change whose deploy failed or was cancelled still publishes on the next push. Every doubt
  # publishes.
  scope:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Compare with the last successful deployment
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          publish() { echo "publish=$1" >> "$GITHUB_OUTPUT"; echo "publish=$1: $2"; exit 0; }
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          # Manual dispatch is the explicit recovery path: always publish.
          [ "$EVENT" = workflow_dispatch ] && publish true "manual dispatch"

          # Newest first. Superseded deployments later turn `inactive`, so look for any `success`
          # status rather than the latest one; failed and cancelled deployments never reach it.
          deployments=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" \
            --jq '.[] | "\(.id) \(.sha)"') || publish true "deployments API error"
          LAST=""
          while read -r id sha; do
            [ -n "$id" ] || continue
            ok=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=100" \
              --jq 'any(.[]; .state == "success")') || publish true "statuses API error"
            if [ "$ok" = true ]; then LAST=$sha; break; fi
          done <<< "$deployments"

          [ -n "$LAST" ] || publish true "no successful deployment found"
          git cat-file -e "$LAST^{commit}" 2>/dev/null || publish true "last deployed $LAST not fetchable"

          echo "last deployed: $LAST"
          echo "candidate:     $HEAD_SHA"
          CHANGED=$(git diff --name-only "$LAST" "$HEAD_SHA" -- site .github/workflows/deploy.yml scripts/version-site-assets.sh) \
            || publish true "diff failed"
          echo "changed published input:"; echo "${CHANGED:-(none)}"
          if [ -n "$CHANGED" ]; then publish true "site changed"; else publish false "site unchanged"; fi

  build:
    needs: scope
    if: needs.scope.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.sha }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Validate's macOS job skips a commit that changes only the site, so the site check runs here,
      # before anything is published.
      - name: Check the site
        run: scripts/validate-site.sh
      # The asset versions are written into a staged copy, never into site/ itself.
      - name: Stage the site with versioned asset addresses
        run: |
          cp -R site "$RUNNER_TEMP/site"
          scripts/version-site-assets.sh --site "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
