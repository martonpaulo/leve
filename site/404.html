<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Page not found · Leve</title>
  <meta name="description" content="The page you asked for does not exist on the Leve website.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:site_name" content="Leve">
  <!-- Before the first paint and the stylesheets: the scroll-in motion hides sections only when
       this ran, and a stored appearance choice applies without a flash (#420). -->
  <script>(function () { var root = document.documentElement; root.classList.add("js"); try { var theme = localStorage.getItem("theme"); if (theme === "light" || theme === "dark") { root.setAttribute("data-theme", theme); var scheme = document.querySelector('meta[name="color-scheme"]'); if (scheme) scheme.setAttribute("content", theme); } } catch (error) {} })();</script>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/accent.css">
  <script src="/scripts/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" aria-label="Primary navigation">
    <div class="site-header-inner">
      <a class="brand" href="/" aria-label="Leve home">
        <img src="/assets/app-icon.png" width="36" height="36" alt="">
        <span>Leve</span>
      </a>
      <nav aria-label="Page sections">
        <a href="/#features">Features</a>
        <a href="/#privacy">Privacy</a>
        <a href="/#get">Get Leve</a>
      </nav>
      <div class="theme-switch" role="radiogroup" aria-label="Appearance" data-theme-switch hidden>
        <label><input type="radio" name="site-theme" value="system" checked><span>System</span></label>
        <label><input type="radio" name="site-theme" value="light"><span>Light</span></label>
        <label><input type="radio" name="site-theme" value="dark"><span>Dark</span></label>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="not-found-title">
      <div class="hero-copy">
        <img class="hero-icon" src="/assets/app-icon.png" width="128" height="128" alt="Leve application icon">
        <p class="eyebrow">Error 404</p>
        <h1 id="not-found-title">Page not found.</h1>
        <p class="hero-summary">There is nothing at this address. Everything about Leve is on the home page.</p>
        <div class="actions"><a class="button primary" href="/">Go to the home page</a></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <p>Developed by Marton Paulo · MIT licensed · © <span data-site-year>2026</span> Leve contributors.</p>
      <nav aria-label="Site links">
        <a target="_blank" href="https://github.com/martonpaulo/leve/issues/new" rel="noopener">Report an Issue…</a>
        <a target="_blank" href="https://github.com/martonpaulo/leve" rel="noopener">GitHub</a>
        <a target="_blank" href="https://martonpaulo.com" rel="noopener">martonpaulo.com</a>
      </nav>
    </div>
  </footer>
</body>
</html>
